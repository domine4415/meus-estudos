<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulado IDECAN — Convenção 169 da OIT</title>
<style>
:root{
  --bg:#07111f; --card:#0d1b2d; --card2:#10233a; --text:#f5f7fb;
  --muted:#a9b7c9; --line:#203752; --accent:#5bbcff;
  --ok:#2ed573; --bad:#ff5a68; --warn:#ffd166; --purple:#b49cff;
}
*{box-sizing:border-box}
body{
  margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  background:linear-gradient(180deg,#06101d,#09182a 45%,#07111f);
  color:var(--text); min-height:100vh;
}
.app{max-width:820px;margin:0 auto;padding:18px 14px 48px}
.top{
  position:sticky;top:0;z-index:10;background:rgba(7,17,31,.94);
  backdrop-filter:blur(10px);padding:10px 0 14px;border-bottom:1px solid var(--line)
}
h1{font-size:1.25rem;margin:0 0 5px}
.sub{color:var(--muted);font-size:.88rem}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center}
.stat b{display:block;font-size:1.02rem}.stat span{font-size:.7rem;color:var(--muted)}
.progress{height:7px;background:#17283c;border-radius:99px;overflow:hidden;margin-top:11px}
.progress>div{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--purple));transition:.25s}
.card{margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 14px 40px rgba(0,0,0,.18)}
.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#132c46;color:#8fd0ff;font-weight:700;font-size:.72rem;letter-spacing:.04em}
.qnum{color:var(--muted);font-size:.82rem;margin:10px 0 7px}
.question{font-size:1.08rem;line-height:1.55;font-weight:700;margin:0 0 16px}
.options{display:grid;gap:10px}
.option{
  width:100%;text-align:left;border:1px solid #2b405a;background:#0a1728;color:var(--text);
  padding:13px 14px;border-radius:13px;cursor:pointer;font-size:.94rem;line-height:1.42;
  transition:.15s
}
.option:hover{border-color:#4f7399;transform:translateY(-1px)}
.option:disabled{cursor:default}
.option.correct{background:rgba(46,213,115,.12);border-color:var(--ok)}
.option.wrong{background:rgba(255,90,104,.12);border-color:var(--bad)}
.letter{display:inline-flex;width:25px;height:25px;align-items:center;justify-content:center;border-radius:7px;
  background:#162b43;margin-right:8px;font-weight:800}
.feedback{display:none;margin-top:17px;border-top:1px solid var(--line);padding-top:16px}
.feedback.show{display:block}
.result{font-weight:900;font-size:1.05rem;margin-bottom:11px}
.result.ok{color:var(--ok)} .result.bad{color:var(--bad)}
.comment{background:#091625;border:1px solid #1d3855;border-radius:14px;padding:14px;line-height:1.52}
.comment h3{font-size:.88rem;margin:0 0 8px;color:#8fd0ff;text-transform:uppercase;letter-spacing:.04em}
.comment p{margin:7px 0;color:#e7edf5}
.schema{margin:11px 0;padding:12px;border-radius:12px;background:#0f2237;border-left:4px solid var(--warn);font-weight:800;line-height:1.7}
.trap{margin-top:10px;padding:10px 12px;border-radius:10px;background:rgba(180,156,255,.08);border:1px solid rgba(180,156,255,.25)}
.trap b{color:var(--purple)}
.actions{display:flex;gap:9px;margin-top:16px}
button.ctrl{border:0;border-radius:11px;padding:11px 15px;font-weight:800;cursor:pointer}
.next{background:var(--accent);color:#031321;flex:1}
.reset{background:#1b2e44;color:#d9e4ef}
.final{display:none;text-align:center}
.final.show{display:block}
.final .big{font-size:2.1rem;font-weight:900;color:var(--accent)}
.review{margin-top:15px;text-align:left}
.small{font-size:.8rem;color:var(--muted)}
@media(max-width:560px){
 .app{padding:10px 10px 34px}.stats{gap:5px}.stat{padding:7px 4px}
 .card{padding:15px;border-radius:15px}.question{font-size:1rem}
 .option{font-size:.9rem;padding:12px}.top{padding-top:7px}
}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <h1>Convenção 169 da OIT — Questões IDECAN</h1>
    <div class="sub">Clique na alternativa. As opções são embaralhadas automaticamente; a correção e o comentário aparecem na hora.</div>
    <div class="stats">
      <div class="stat"><b id="current">1/20</b><span>QUESTÃO</span></div>
      <div class="stat"><b id="hits">0</b><span>ACERTOS</span></div>
      <div class="stat"><b id="misses">0</b><span>ERROS</span></div>
      <div class="stat"><b id="rate">0%</b><span>APROVEIT.</span></div>
    </div>
    <div class="progress"><div id="bar"></div></div>
  </div>

  <div id="quizCard" class="card">
    <span class="badge">ESTILO IDECAN • A–E</span>
    <div id="qnum" class="qnum"></div>
    <div id="question" class="question"></div>
    <div id="options" class="options"></div>
    <div id="feedback" class="feedback">
      <div id="result" class="result"></div>
      <div id="comment" class="comment"></div>
      <div class="actions">
        <button class="ctrl next" id="nextBtn">Próxima questão →</button>
      </div>
    </div>
  </div>

  <div id="final" class="card final">
    <span class="badge">RESULTADO FINAL</span>
    <div style="margin-top:14px" class="big" id="finalScore"></div>
    <p id="finalText"></p>
    <div class="review" id="review"></div>
    <button class="ctrl reset" onclick="restart()">Refazer simulado</button>
  </div>
</div>

<script>

function shuffledQuestion(q){
  const opts = q.a.map((text, i) => ({text, correct: i === q.c}));
  for(let i = opts.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [opts[i], opts[j]] = [opts[j], opts[i]];
  }
  return {
    ...q,
    a: opts.map(x => x.text),
    c: opts.findIndex(x => x.correct)
  };
}

const questionBank = [
{
q:"De acordo com a aula, a Convenção 169 da OIT aplica-se, especialmente, a quais grupos?",
a:["Apenas aos trabalhadores rurais.","Aos povos indígenas e aos povos tribais.","Somente aos povos indígenas reconhecidos formalmente pelo Estado.","A todos os grupos étnicos minoritários, sem distinção.","Exclusivamente aos povos tribais situados em países dependentes."],
c:1,
com:`<h3>Comentário da questão</h3>
<p>A Convenção 169 foi apresentada na aula como instrumento de proteção dos <b>povos indígenas e tribais</b>.</p>
<div class="schema">CONVENÇÃO 169 → INDÍGENAS + TRIBAIS</div>
<div class="trap"><b>Pegadinha IDECAN:</b> restringir a proteção apenas aos indígenas ou exigir reconhecimento estatal formal.</div>`
},
{
q:"Segundo a explicação da aula, a consciência da identidade indígena ou tribal constitui:",
a:["Critério meramente subsidiário.","Requisito dependente de homologação judicial.","Critério fundamental para determinar os grupos aos quais se aplica a Convenção.","Presunção absoluta de propriedade territorial.","Exigência exclusivamente administrativa."],
c:2,
com:`<h3>Comentário da questão</h3>
<p>A <b>autoidentificação/autodeclaração</b> aparece como critério fundamental.</p>
<div class="schema">QUEM É → SABE QUE É → IDENTIFICA-SE COMO TAL</div>
<div class="trap"><b>Não confunda:</b> a aula não condiciona a identidade a um ato estatal constitutivo.</div>`
},
{
q:"Na sistematização apresentada na aula, a Convenção 169 da OIT possui, no ordenamento brasileiro, status:",
a:["Constitucional originário.","De lei ordinária federal.","Supralegal.","De emenda constitucional.","Infralegal, abaixo das leis ordinárias."],
c:2,
com:`<h3>Comentário da questão</h3>
<p>O ponto enfatizado foi o <b>status supralegal</b>: abaixo da Constituição e acima das leis.</p>
<div class="schema">CONSTITUIÇÃO<br>↓<br>CONVENÇÃO 169 — SUPRALEGAL<br>↓<br>LEIS</div>
<div class="trap"><b>Pegadinha:</b> “lei ordinária” e “status constitucional” foram expressamente afastados na aula.</div>`
},
{
q:"Para que um tratado internacional de direitos humanos tenha equivalência às emendas constitucionais, a aula relembra o rito de aprovação de:",
a:["Maioria simples, em sessão conjunta.","Maioria absoluta, em turno único.","Dois quintos, em duas Casas e dois turnos.","Três quintos, em cada Casa, em dois turnos.","Unanimidade do Congresso Nacional."],
c:3,
com:`<h3>Comentário da questão</h3>
<p>O macete apresentado foi: <b>2 Casas + 2 turnos + 3/5</b>.</p>
<div class="schema">2 CASAS → 2 TURNOS → 3/5</div>
<div class="trap"><b>Observe:</b> esta questão cobra o rito mencionado na explicação da hierarquia, não uma característica exclusiva da Convenção 169.</div>`
},
{
q:"Sempre que sejam previstas medidas legislativas ou administrativas suscetíveis de afetar diretamente os povos interessados, os governos devem:",
a:["Apenas comunicar a decisão depois de publicada.","Consultar os povos interessados por procedimentos apropriados e por suas instituições representativas.","Submeter obrigatoriamente a decisão ao Poder Judiciário.","Obter autorização individual de todos os membros da comunidade.","Dispensar qualquer consulta quando houver interesse público."],
c:1,
com:`<h3>Comentário da questão</h3>
<p>Este é um dos núcleos da aula: <b>consulta aos povos interessados</b>.</p>
<div class="schema">MEDIDA QUE AFETA O POVO<br>↓<br>CONSULTA<br>↓<br>PROCEDIMENTO APROPRIADO + INSTITUIÇÕES REPRESENTATIVAS</div>
<div class="trap"><b>IDECAN gosta de trocar:</b> consulta prévia por mera comunicação posterior.</div>`
},
{
q:"A consulta aos povos indígenas e tribais, segundo o esquema destacado na aula, deve ser:",
a:["Posterior, vinculante, secreta e estatal.","Prévia, livre, informada e realizada de boa-fé.","Facultativa, pública, gratuita e judicial.","Prévia, obrigatoriamente unânime e definitiva.","Livre, porém dispensável em medidas administrativas."],
c:1,
com:`<h3>Comentário da questão</h3>
<p>Decore o conjunto enfatizado na aula.</p>
<div class="schema">P-L-I-B<br>P = PRÉVIA<br>L = LIVRE<br>I = INFORMADA<br>B = BOA-FÉ</div>
<div class="trap"><b>Pegadinha:</b> a banca mistura expressões bonitas, mas você deve reconhecer o conjunto específico trabalhado.</div>`
},
{
q:"Quanto à participação dos povos indígenas e tribais, assinale a alternativa correta conforme a aula.",
a:["Devem apenas receber as políticas públicas já definidas.","Sua participação restringe-se a assuntos culturais.","Podem participar livremente das decisões que os afetem.","A participação depende de autorização do Poder Legislativo.","Somente representantes do governo podem definir prioridades de desenvolvimento."],
c:2,
com:`<h3>Comentário da questão</h3>
<p>A Convenção foi explicada como um modelo de <b>participação</b>, e não de tutela puramente passiva.</p>
<div class="schema">NÃO SÃO SÓ DESTINATÁRIOS<br>↓<br>DEVEM PARTICIPAR DAS DECISÕES</div>
<div class="trap"><b>Palavra-chave:</b> participação livre.</div>`
},
{
q:"Nos termos da exposição sobre o art. 7º, cabe aos próprios povos interessados:",
a:["Renunciar às prioridades de desenvolvimento em favor do governo.","Decidir suas prioridades no processo de desenvolvimento e participar de planos e programas que os afetem.","Administrar exclusivamente todos os serviços públicos locais.","Impedir qualquer política pública em seus territórios.","Definir as competências legislativas da União."],
c:1,
com:`<h3>Comentário da questão</h3>
<p>O art. 7º foi associado ao <b>direito de decidir prioridades</b> e participar dos planos e programas que os atinjam.</p>
<div class="schema">ART. 7º → PRIORIDADES + PARTICIPAÇÃO</div>
<div class="trap"><b>Cuidado:</b> participação não significa poder absoluto de veto sobre toda e qualquer ação estatal.</div>`
},
{
q:"De acordo com a aula, a relação dos povos indígenas e tribais com suas terras deve considerar, entre outros aspectos:",
a:["Somente o valor econômico da área.","Apenas a função produtiva da terra.","O valor espiritual, cultural e tradicional das terras.","Exclusivamente a titularidade registral.","Somente a finalidade residencial."],
c:2,
com:`<h3>Comentário da questão</h3>
<p>A terra não foi tratada como simples moradia. A professora destacou seu <b>valor espiritual</b> e sua dimensão cultural e tradicional.</p>
<div class="schema">TERRA ≠ SÓ MORADIA<br>→ ESPIRITUAL<br>→ CULTURAL<br>→ TRADICIONAL</div>
<div class="trap"><b>Pegadinha:</b> reduzir a proteção ao aspecto patrimonial ou residencial.</div>`
},
{
q:"No que se refere às terras tradicionalmente ocupadas, a Convenção 169, conforme exposto na aula, reconhece direitos de:",
a:["Posse apenas.","Propriedade apenas.","Uso precário e temporário.","Posse e propriedade.","Habitação, sem qualquer direito territorial."],
c:3,
com:`<h3>Comentário da questão</h3>
<p>Na abordagem da aula sobre o art. 14, aparecem <b>propriedade + posse</b>.</p>
<div class="schema">ART. 14 → POSSE + PROPRIEDADE</div>
<div class="trap"><b>Pegadinha forte:</b> a professora alertou para não misturar o texto da Convenção com o texto constitucional.</div>`
},
{
q:"Os direitos dos povos interessados sobre os recursos naturais existentes em suas terras devem ser:",
a:["Transferidos ao governo.","Especialmente protegidos.","Protegidos apenas quando houver exploração comercial.","Desconsiderados diante de qualquer empreendimento público.","Limitados à extração de recursos renováveis."],
c:1,
com:`<h3>Comentário da questão</h3>
<p>O art. 15 foi apresentado com uma expressão-chave: <b>especialmente protegidos</b>.</p>
<div class="schema">RECURSOS NATURAIS → PROTEÇÃO ESPECIAL</div>
<div class="trap"><b>IDECAN:</b> uma palavra pode decidir a questão. Aqui, guarde “especialmente”.</div>`
},
{
q:"A participação dos povos interessados em relação aos recursos naturais alcança, segundo a aula:",
a:["Apenas a fiscalização.","Utilização, administração e conservação.","Somente a conservação ambiental.","Apenas a administração financeira.","Exclusivamente a exploração econômica."],
c:1,
com:`<h3>Comentário da questão</h3>
<p>A tríade apresentada foi objetiva.</p>
<div class="schema">RECURSOS NATURAIS<br>→ UTILIZAÇÃO<br>→ ADMINISTRAÇÃO<br>→ CONSERVAÇÃO</div>
<div class="trap"><b>Macete:</b> U-A-C. Se a alternativa cortar um dos três ou restringir a apenas um, desconfie.</div>`
},
{
q:"Em relação ao translado dos povos indígenas e tribais das terras que ocupam, a regra geral indicada na aula é:",
a:["A remoção sempre que houver conveniência administrativa.","A remoção mediante indenização prévia.","A não remoção das terras que ocupam.","A remoção por decisão unilateral do governo.","A transferência automática para terras equivalentes."],
c:2,
com:`<h3>Comentário da questão</h3>
<p>O ponto central do art. 16 foi destacado diversas vezes: <b>a regra é não transladar</b>.</p>
<div class="schema">REGRA → NÃO RETIRAR / NÃO TRANSLADAR</div>
<div class="trap"><b>Cuidado:</b> existem exceções, mas elas não transformam a remoção em regra.</div>`
},
{
q:"Quando, excepcionalmente, o translado ou reassentamento for considerado necessário, a aula aponta, como primeira referência, a necessidade de:",
a:["Consentimento livre e pleno conhecimento de causa.","Aprovação por maioria simples do Congresso.","Autorização judicial obrigatória.","Indenização como único requisito.","Consulta posterior ao reassentamento."],
c:0,
com:`<h3>Comentário da questão</h3>
<p>Na exceção, busca-se o <b>consentimento livre</b>, com <b>pleno conhecimento de causa</b>.</p>
<div class="schema">EXCEÇÃO: RETIRADA NECESSÁRIA<br>↓<br>CONSENTIMENTO LIVRE + CONHECIMENTO DE CAUSA</div>
<div class="trap"><b>Não confunda:</b> indenização aparece na proteção ao transladado, mas não substitui todo o procedimento.</div>`
},
{
q:"Não sendo possível obter o consentimento para o translado ou reassentamento, estes somente poderão ocorrer:",
a:["Por ordem administrativa sem participação dos interessados.","Após procedimentos adequados previstos na legislação, com possibilidade de efetiva representação dos povos.","Depois de simples aviso escrito.","Se houver pagamento antecipado de indenização.","Mediante consulta exclusivamente individual."],
c:1,
com:`<h3>Comentário da questão</h3>
<p>Ausência de consentimento não significa liberdade estatal. A aula exige <b>procedimentos adequados</b> e possibilidade de <b>representação efetiva</b>.</p>
<div class="schema">SEM CONSENTIMENTO<br>↓<br>PROCEDIMENTO LEGAL ADEQUADO<br>↓<br>REPRESENTAÇÃO / PARTICIPAÇÃO EFETIVA</div>
<div class="trap"><b>Pegadinha:</b> trocar procedimento por simples comunicação.</div>`
},
{
q:"Cessadas as causas que motivaram o translado dos povos de suas terras tradicionais, a regra apresentada é:",
a:["Conversão automática da área em bem público.","Perda definitiva de qualquer vínculo com a terra.","Direito de voltar às terras tradicionais, sempre que possível.","Pagamento de indenização em substituição obrigatória ao retorno.","Nova consulta apenas cinco anos depois."],
c:2,
com:`<h3>Comentário da questão</h3>
<p>Terminada a causa que justificou a retirada, surge o <b>direito de retorno</b>, sempre que possível.</p>
<div class="schema">CAUSA DA RETIRADA ACABOU?<br>→ SIM<br>→ DIREITO DE VOLTAR</div>
<div class="trap"><b>Não transforme a exceção em regra:</b> o reassentamento definitivo entra quando o retorno não for possível.</div>`
},
{
q:"Quando o retorno às terras tradicionais não for possível, a aula indica que os povos deverão, quando possível, receber:",
a:["Qualquer área disponível, ainda que inferior.","Apenas indenização pecuniária.","Terras de qualidade e situação jurídica pelo menos equivalentes às anteriores, além da proteção indenizatória mencionada.","Moradia urbana provisória.","Somente recursos para aquisição futura de imóveis."],
c:2,
com:`<h3>Comentário da questão</h3>
<p>O reassentamento deve buscar terras <b>pelo menos equivalentes</b>, e a aula também ressalta a <b>indenização</b> das pessoas transladadas.</p>
<div class="schema">NÃO DÁ PARA VOLTAR<br>↓<br>NOVA TERRA EQUIVALENTE<br>+<br>INDENIZAÇÃO</div>
<div class="trap"><b>Palavra-chave:</b> equivalência. A banca pode oferecer “qualquer terra”.</div>`
},
{
q:"Sobre a transmissão dos direitos sobre as terras entre os membros dos povos interessados, assinale a correta.",
a:["As modalidades próprias de transmissão devem ser respeitadas.","A Convenção proíbe toda transmissão de direitos territoriais.","Apenas o direito civil comum pode ser considerado.","A transmissão depende sempre de autorização judicial.","As modalidades tradicionais não possuem relevância jurídica."],
c:0,
com:`<h3>Comentário da questão</h3>
<p>No trecho sobre o art. 17, a aula afirma que devem ser <b>respeitadas as modalidades de transmissão</b> existentes entre os membros desses povos.</p>
<div class="schema">ART. 17 → RESPEITO ÀS MODALIDADES DE TRANSMISSÃO</div>
<div class="trap"><b>Cuidado:</b> a norma não apaga automaticamente as formas próprias desses povos.</div>`
},
{
q:"A Convenção, conforme a aula, exige medidas para impedir que pessoas alheias aos povos interessados:",
a:["Mantenham qualquer contato com as comunidades.","Participem de políticas públicas locais.","Se aproveitem de seus costumes ou do desconhecimento para obter indevidamente direitos sobre suas terras.","Realizem pesquisas acadêmicas.","Ingressem em terras públicas próximas."],
c:2,
com:`<h3>Comentário da questão</h3>
<p>A proteção territorial também busca impedir o <b>aproveitamento indevido por terceiros</b>.</p>
<div class="schema">TERCEIROS DE FORA<br>+ APROVEITAMENTO DE COSTUMES/DESCONHECIMENTO<br>→ DEVE SER IMPEDIDO</div>
<div class="trap"><b>IDECAN:</b> cuidado com alternativas exageradas que criem proibição absoluta de contato.</div>`
},
{
q:"Assinale a alternativa que melhor resume a lógica central da parte da Convenção 169 trabalhada na aula.",
a:["Tutela estatal sem participação dos povos, com prioridade para decisões administrativas.","Reconhecimento estatal obrigatório, ausência de consulta e proteção apenas trabalhista.","Autoidentificação, consulta prévia, participação, proteção territorial e salvaguarda dos recursos naturais.","Direito de propriedade sem proteção cultural ou espiritual.","Consulta posterior, remoção livre e indenização apenas facultativa."],
c:2,
com:`<h3>Comentário da questão</h3>
<p>Esta é uma questão de fechamento, juntando os eixos repetidos na aula.</p>
<div class="schema">169 = AUTOIDENTIFICAÇÃO<br>+ CONSULTA PRÉVIA<br>+ PARTICIPAÇÃO<br>+ TERRA<br>+ RECURSOS NATURAIS / PROTEÇÃO</div>
<div class="trap"><b>Para a prova:</b> quando a alternativa desmontar a participação ou transformar consulta prévia em posterior, ela tende a contrariar o núcleo estudado.</div>`
}
];

let questions = questionBank.map(shuffledQuestion);
let idx=0,hits=0,misses=0,answered=false;
const wrongList=[];

function render(){
  const q=questions[idx];
  answered=false;
  document.getElementById("current").textContent=`${idx+1}/${questions.length}`;
  document.getElementById("qnum").textContent=`QUESTÃO ${String(idx+1).padStart(2,"0")} DE ${questions.length}`;
  document.getElementById("question").textContent=q.q;
  document.getElementById("feedback").classList.remove("show");
  const box=document.getElementById("options"); box.innerHTML="";
  q.a.forEach((t,i)=>{
    const b=document.createElement("button");
    b.className="option";
    b.innerHTML=`<span class="letter">${String.fromCharCode(65+i)}</span>${t}`;
    b.onclick=()=>answer(i,b);
    box.appendChild(b);
  });
  updateStats();
}
function answer(i,btn){
  if(answered)return; answered=true;
  const q=questions[idx], buttons=[...document.querySelectorAll(".option")];
  buttons.forEach(x=>x.disabled=true);
  buttons[q.c].classList.add("correct");
  const res=document.getElementById("result");
  if(i===q.c){
    hits++; res.textContent="✓ ACERTOU!"; res.className="result ok";
  }else{
    misses++; wrongList.push(idx); btn.classList.add("wrong");
    res.textContent=`✕ ERROU. Gabarito: ${String.fromCharCode(65+q.c)}`;
    res.className="result bad";
  }
  document.getElementById("comment").innerHTML=q.com;
  document.getElementById("feedback").classList.add("show");
  document.getElementById("nextBtn").textContent=idx===questions.length-1?"Ver resultado →":"Próxima questão →";
  updateStats();
  setTimeout(()=>document.getElementById("feedback").scrollIntoView({behavior:"smooth",block:"nearest"}),100);
}
function updateStats(){
  document.getElementById("hits").textContent=hits;
  document.getElementById("misses").textContent=misses;
  const total=hits+misses;
  document.getElementById("rate").textContent=total?Math.round(hits/total*100)+"%":"0%";
  document.getElementById("bar").style.width=((total/questions.length)*100)+"%";
}
document.getElementById("nextBtn").onclick=()=>{
  if(idx<questions.length-1){idx++;render();window.scrollTo({top:0,behavior:"smooth"});}
  else finish();
};
function finish(){
  document.getElementById("quizCard").style.display="none";
  const f=document.getElementById("final"); f.classList.add("show");
  const pct=Math.round(hits/questions.length*100);
  document.getElementById("finalScore").textContent=`${hits}/${questions.length} • ${pct}%`;
  let txt=pct>=90?"Excelente. Revisão muito forte para a prova.":
          pct>=75?"Bom desempenho. Revise principalmente as pegadinhas que errou.":
          pct>=60?"Você já tem a base, mas precisa revisar os pontos errados antes da prova.":
          "Volte aos comentários e refaça o simulado após uma revisão curta.";
  document.getElementById("finalText").textContent=txt;
  const rv=document.getElementById("review");
  if(wrongList.length){
    rv.innerHTML="<h3 style='color:#ffbdc3'>Pontos para revisar</h3>"+wrongList.map(n=>`<div class="small" style="margin:7px 0">• Questão ${n+1}: ${questions[n].q}</div>`).join("");
  }else{
    rv.innerHTML="<p style='color:#2ed573;font-weight:800'>Você não errou nenhuma questão.</p>";
  }
  window.scrollTo({top:0,behavior:"smooth"});
}
function restart(){
 questions = questionBank.map(shuffledQuestion);
 idx=0;hits=0;misses=0;wrongList.length=0;
 document.getElementById("final").classList.remove("show");
 document.getElementById("quizCard").style.display="block";
 render(); window.scrollTo({top:0,behavior:"smooth"});
}
render();
</script>
</body>
</html>
